version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: strategos-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  express-backend:
    build:
      context: ./server
    container_name: strategos-express
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - MONGO_URI=mongodb://mongodb:27017/strategos_db
    depends_on:
      - mongodb

  ml-service:
    build:
      context: ./backend
    container_name: strategos-ml
    ports:
      - "8001:8001"
    env_file:
      - ./backend/.env

  frontend:
    build:
      context: ./frontend
    container_name: strategos-frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:5001/api
    depends_on:
      - express-backend

volumes:
  mongo_data:
